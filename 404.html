<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · célibmap</title>
<meta name="robots" content="noindex">
<style>
  body { font: 16px/1.5 system-ui, sans-serif; color: #241f17; background: #f2ead9; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
  main { max-width: 30rem; }
  h1 { font-size: 1.3rem; margin: 0 0 0.5rem; }
  a { color: #1f4e9a; }
  @media (prefers-color-scheme: dark) { body { color: #f2f3f5; background: #101216; } a { color: #9bbcf0; } }
</style>
<script>
  // Une adresse de ville mal recopiée (…/p/1234.html) ou un ancien lien : retour à la carte, en
  // conservant le fragment d'état s'il y en a un.
  var base = location.pathname.replace(/\/(p\/[^/]*|classement\/?|[^/]*)$/, '/');
  if (location.hash) location.replace(base + location.hash);
</script>
</head>
<body>
<main>
  <p><strong>célibmap</strong></p>
  <h1>Cette page n'existe pas.</h1>
  <p>L'adresse est peut-être incomplète. <a href="./" id="home">Revenir à la carte</a> · <a href="./classement/">Classement des villes</a></p>
  <p lang="en"><small>This page does not exist. <a href="./">Back to the map</a>.</small></p>
</main>
<script>
  var home = document.getElementById('home'); home.href = base;
  document.querySelector('a[href="./classement/"]').href = base + 'classement/';
</script>
</body>
</html>
